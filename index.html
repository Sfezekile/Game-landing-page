<!DOCTYPE html>
<html lang='en'>
<head>

<meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Document</title>
    <link rel='stylesheet' href='style.css'>
    <link href='https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css' rel='stylesheet'/>
</head>
<body>

    <!-- HERO -->
    <section class="hero">
        <video autoplay muted loop playsinline no-controls
            aria-label="" load="lazy" class="hero-video">
            <source src="270507.mp4" type="video/mp4">
        </video>
        <div class="container">
            <div class="hero-content">
                <h1>Cozy Play</h1>
                <!-- <p class="sub">Game Play</p> -->
            </div>
            <div class="action-buttons">
                <button class="btn-outline-w" id="openProjectBtn">Start Game</button>
                <button class="btn-outline-m" id="openAboutBtn">Resume Game</button>
                <button class="btn-outline-w" id="openSettingsBtn" data-set="settings">Settings</button>
                <button class="btn-outline-m" id="openAboutBtn">About Me</button>
            </div>

            <div class="setting-section">
                <h2>Settings</h2>
                <div class="setting-buttons">
                    <button class="btn-outline-w" id="openProjectBtn">Start Game</button>
                    <button class="btn-outline-m" id="openAboutBtn">Resume Game</button>
                    <button class="btn-outline-w" id="openSettingsBtn" data-set="settings">Settings</button>
                    <button class="btn-outline-m" id="openAboutBtn">About Me</button>
                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
